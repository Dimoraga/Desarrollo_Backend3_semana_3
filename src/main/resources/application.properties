spring.application.name=sumativauno

spring.batch.job.enabled=false

# Spring Boot 4.1.1 ya no trae inicializacion automatica del esquema de
# metadatos de Spring Batch (spring.batch.jdbc.initialize-schema dejo de
# tener efecto), por lo que se crea manualmente via el mecanismo generico
# de inicializacion SQL de Spring Boot. El script usa IF NOT EXISTS, por lo
# que es seguro ejecutarlo en cada arranque.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-batch-mysql.sql
spring.jpa.defer-datasource-initialization=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

spring.profiles.active=local

logging.level.com.duoc.sumativauno=INFO